<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2848E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quêtes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<title>Quêtes de famille</title>
<style>[hidden]{display:none!important}html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<style>
/* Concept : un carnet de quêtes en colonne mobile. Chaque quête est un billet dont le talon doré porte la valeur en points. Une barre d'onglets basse change d'espace selon le rôle (tuteur ou mineur). */
:root{
  --bg:#EEF2F9; --surface:#FFFFFF; --surface-2:#E3E9F5; --ink:#0F1A33; --ink-2:#4B5877; --line:#D3DBEC;
  --accent:#2848E8; --accent-ink:#FFFFFF; --accent-soft:#E0E7FF;
  --coin:#F6B820; --coin-ink:#3A2600; --coin-soft:#FFF1CC; --coin-text:#855700;
  --ok:#0E8F5B; --ok-ink:#FFFFFF; --ok-soft:#D9F3E7;
  --bad:#D8383F; --bad-ink:#FFFFFF; --bad-soft:#FBE1E2;
  --av1:#E4572E; --av2:#12968B; --av3:#7B4FE0; --av4:#B87A00; --av5:#2D7FF9; --av6:#D6336C;
  --shadow:0 1px 2px rgba(15,26,51,.06),0 6px 18px rgba(15,26,51,.07);
  --f-display:'Bricolage Grotesque','Avenir Next','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1226; --surface:#121C37; --surface-2:#1A2646; --ink:#E9EFFF; --ink-2:#9AA9CD; --line:#26335A;
  --accent:#7C95FF; --accent-ink:#0A1226; --accent-soft:#1F2C5E;
  --coin:#F7C23C; --coin-ink:#2E1E00; --coin-soft:#3A2D0B; --coin-text:#F7C23C;
  --ok:#3DD598; --ok-ink:#06241A; --ok-soft:#10392B;
  --bad:#FF7A80; --bad-ink:#2A0A0C; --bad-soft:#40181B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1226; --surface:#121C37; --surface-2:#1A2646; --ink:#E9EFFF; --ink-2:#9AA9CD; --line:#26335A;
  --accent:#7C95FF; --accent-ink:#0A1226; --accent-soft:#1F2C5E;
  --coin:#F7C23C; --coin-ink:#2E1E00; --coin-soft:#3A2D0B; --coin-text:#F7C23C;
  --ok:#3DD598; --ok-ink:#06241A; --ok-soft:#10392B;
  --bad:#FF7A80; --bad-ink:#2A0A0C; --bad-soft:#40181B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:60vh}
.muted{color:var(--ink-2)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Avatars et pièces */
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font:700 18px/1 var(--f-display);flex:none}
.av.s{width:22px;height:22px;font-size:12px}
.av.ph{background-size:cover;background-position:center;color:transparent}
.av.big{width:96px;height:96px;font-size:40px}
.h0{background:var(--av1)}.h1{background:var(--av2)}.h2{background:var(--av3)}.h3{background:var(--av4)}.h4{background:var(--av5)}.h5{background:var(--av6)}
.coin{width:24px;height:24px;border-radius:50%;background:var(--coin);color:var(--coin-ink);display:inline-grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);flex:none}
.coin .i{width:13px;height:13px;fill:currentColor;stroke:none}
.coin.big{width:68px;height:68px}.coin.big .i{width:32px;height:32px}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.who-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;min-width:0}
.who-btn .t{display:grid;min-width:0}
.who-btn b{font:700 17px/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-btn small{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.bal{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn.sm{width:36px;height:36px}
.dot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--bad-ink);font:700 12px/20px var(--f-body);text-align:center}
.banner{background:var(--coin-soft);color:var(--coin-text);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:8px}

/* Sections */
.sec{display:flex;align-items:center;gap:8px;font:700 13px var(--f-body);color:var(--ink-2);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px}
.sec .n{background:var(--surface-2);color:var(--ink);border-radius:10px;padding:1px 8px;letter-spacing:0}
.sub{font:700 16px var(--f-display);margin:22px 0 10px}

/* Billet de quête */
.tk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 84px;background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.tk-main{padding:14px 14px 14px 16px;display:grid;gap:6px;min-width:0;align-content:start}
.tk h3{font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.tk-stub{position:relative;display:grid;place-content:center;justify-items:center;background:var(--coin);color:var(--coin-ink);border-left:2px dashed rgba(40,25,0,.35)}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.tk-stub::before{top:-11px}.tk-stub::after{bottom:-11px}
.tk-stub b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tk-stub small{font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.tk.wait .tk-stub{background:var(--surface-2);color:var(--ink-2);border-left-color:var(--line)}
.tk.done .tk-stub{background:var(--ok-soft);color:var(--ok);border-left-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:3px 10px}
.chip .av{margin-left:-6px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--coin-soft);color:var(--coin-text)}
.note{font-size:14px;background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:6px 10px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;align-items:center}

/* Cartes et lignes */
.card{background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;display:grid;gap:8px}
.wh{display:flex;gap:12px;align-items:flex-start}
.grow{flex:1;min-width:0}
.wish h3{font-size:18px;line-height:1.25;overflow-wrap:anywhere;margin-top:6px}
.price{display:inline-flex;align-items:center;gap:6px;font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:0;border-radius:14px;padding:10px 12px;text-align:left;margin-bottom:8px;box-shadow:var(--shadow)}
.row .grow{display:grid}
.row b{font:700 17px var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--ink-2)}
.tag{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.empty{display:grid;gap:8px;justify-items:center;text-align:center;padding:34px 20px;border:2px dashed var(--line);border-radius:18px;margin:22px 0}
.empty h3{font-size:19px}
.empty p{color:var(--ink-2);max-width:34ch}
progress{appearance:none;-webkit-appearance:none;width:100%;height:10px;border:0;border-radius:5px;overflow:hidden;background:var(--surface-2)}
progress::-webkit-progress-bar{background:var(--surface-2)}
progress::-webkit-progress-value{background:var(--coin);border-radius:5px}
progress::-moz-progress-bar{background:var(--coin);border-radius:5px}
.hero{display:flex;align-items:center;gap:16px;background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-top:6px}
.hero small{color:var(--ink-2);font-weight:600;display:block}
.hero .n{font:800 56px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hero.sm{padding:12px;margin:0 0 4px}.hero.sm .n{font-size:36px}.hero.sm .coin.big{width:44px;height:44px}
.code{font:800 44px/1 var(--f-display);letter-spacing:.12em;text-align:center;padding:10px 0;color:var(--accent)}
.lbl{font-weight:700;font-size:14px}
.lst{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.lst li{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.lst li.new{background:var(--accent-soft)}
.lst small{color:var(--ink-2);display:block}
.lst .delta{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* Boutons et formulaires */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.block{display:flex;width:100%;margin-top:6px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.busy,.btn[disabled]{opacity:.55;pointer-events:none}
.box{width:18px;height:18px;border-radius:50%;border:2px solid currentColor}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:14px 0;text-decoration:underline}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink-2);font-weight:600;padding:10px 0 10px 0}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:14px}
.field small{color:var(--ink-2);font-size:13px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.code-in{text-align:center;font:700 28px var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.check-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:600}
.check-row input{width:22px;height:22px;accent-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:40px;padding:0 15px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.on{background:var(--coin);border-color:var(--coin);color:var(--coin-ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin:12px 0 18px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:700;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.err{color:var(--bad);font-weight:600;min-height:1.3em;margin-bottom:6px;font-size:14px}

/* Accueil */
.auth{padding-block:18px 24px}
.auth h1{font-size:30px;line-height:1.1}
.brand{display:grid;justify-items:start;gap:12px;margin:18px 0 26px}
.brand h1{font-size:36px}
.lead{color:var(--ink-2);font-size:17px;max-width:40ch}
.role{display:grid;gap:4px;width:100%;text-align:left;border:0;border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.role b{font:700 24px var(--f-display)}
.role.t{background:var(--accent);color:var(--accent-ink)}
.role.k{background:var(--coin);color:var(--coin-ink)}
.role span{opacity:.88}
.center{display:grid;justify-items:center;gap:14px;text-align:center;padding:90px 10px}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.tab{display:grid;justify-items:center;gap:2px;background:none;border:0;padding:4px 2px;color:var(--ink-2);font-size:12px;font-weight:600}
.tab .w{position:relative;display:grid;place-items:center;width:54px;height:30px;border-radius:15px}
.tab .i{width:23px;height:23px}
.tab.on{color:var(--accent)}
.tab.on .w{background:var(--accent-soft)}
.tab .dot{top:-5px;right:-1px}

/* Feuille modale et message */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,30,.55)}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.sh-head h2{font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);text-align:center}
.toast.bad{background:var(--bad);color:var(--bad-ink)}
.msgs{display:grid;gap:8px;padding-bottom:8px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:90%}
.msg.me{justify-self:end;flex-direction:row-reverse}
.msg .b{background:var(--surface);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:var(--shadow);min-width:0}
.msg.me .b{background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px}
.msg .who{font-size:12px;font-weight:700;opacity:.75}
.msg .t{white-space:pre-wrap;overflow-wrap:anywhere}
.mx{border:0;background:none;color:var(--ink-2);padding:4px;border-radius:8px;display:grid;place-items:center;flex:none}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.composer input{flex:1;min-width:0}
.composer .btn{padding:0 16px}
.bil{display:grid;gap:6px;padding:6px 0}
.bil-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--coin);border-radius:5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--ink-2)}
.bdg.on{background:var(--coin-soft);color:var(--coin-text)}
.bdg b{font:700 14px var(--f-display)}
.bdg small{font-size:12.5px}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swatch{width:48px;height:48px;border-radius:50%;border:3px solid transparent;color:#fff;font:700 18px var(--f-display)}
.swatch.on{border-color:var(--ink)}
.lst li b{overflow-wrap:anywhere}
.app{position:relative;z-index:1}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none}
#bgfx::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--veil,.55)}
.has-bg .top{background:transparent;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.has-bg::before{background:transparent}
.steps{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:2px}
.stp{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;text-align:left;font-weight:600;color:var(--ink)}
.stp.ro{padding:2px 0;font-weight:500;color:var(--ink-2)}
.stp.on .box{background:var(--ok);border-color:var(--ok)}
.stp.on{color:var(--ink-2);text-decoration:line-through}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.chart .col{flex:1;display:grid;justify-items:center;align-content:end;gap:4px;min-width:0}
.chart .cb{width:100%;max-width:34px;background:var(--coin);border-radius:6px 6px 2px 2px;min-height:3px}
.chart .col small{font-size:12px;color:var(--ink-2)}
.notice{background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-weight:600}
.rank{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rank li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.rank li.me{background:var(--coin-soft);color:var(--coin-text)}
.rank b{margin-left:auto;font-variant-numeric:tabular-nums}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bgp{aspect-ratio:1;border-radius:14px;border:3px solid transparent;box-shadow:var(--shadow);padding:0}
.bgp.on{border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding:4px}
input[type=file]{width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app" class="app"></div>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<div id="bgfx" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getFirestore, doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, addDoc, onSnapshot, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, sendPasswordResetEmail, deleteUser, EmailAuthProvider, reauthenticateWithCredential, verifyBeforeUpdateEmail } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

const cfg = {
  "apiKey": "AIzaSyDamgo5t-QPHjOoazkp1n5xzgL-HwsKfWk",
  "authDomain": "quetes-famille.firebaseapp.com",
  "projectId": "quetes-famille",

};
const app = initializeApp(cfg);
const fs = getFirestore(app);
const auth = getAuth(app);
const secAuth = getAuth(initializeApp(cfg, "secondary"));

const clean = v => JSON.parse(JSON.stringify(v));
const wrap = e => { const x = new Error(e && e.message || "erreur"); x.code = String((e && e.code) || "").replace(/^firestore\//, ""); throw x; };
const dsnap = s => ({ id: s.id, exists: s.exists(), data: () => (s.exists() ? s.data() : undefined) });
const qsnap = qs => { const docs = qs.docs.map(dsnap); return { docs, size: docs.length, empty: docs.length === 0 }; };
const autoId = () => doc(collection(fs, "x")).id;

function docRef(path) {
  const r = doc(fs, path);
  return {
    id: r.id, path,
    get: () => getDoc(r).then(dsnap, wrap),
    set: d => setDoc(r, clean(d)).catch(wrap),
    update: d => updateDoc(r, clean(d)).catch(wrap),
    delete: () => deleteDoc(r).catch(wrap),
    onSnapshot: (next, err) => onSnapshot(r, s => next(dsnap(s)), e => { try { wrap(e); } catch (x) { if (err) err(x); } }),
    collection: n => colRef(path + "/" + n)
  };
}
function colRef(path, cons = []) {
  const q = () => query(collection(fs, path), ...cons);
  return {
    path,
    where: (f, o, v) => colRef(path, [...cons, where(f, o, v)]),
    orderBy: (f, d) => colRef(path, [...cons, orderBy(f, d || "asc")]),
    limit: n => colRef(path, [...cons, limit(n)]),
    get: () => getDocs(q()).then(qsnap, wrap),
    onSnapshot: (next, err) => onSnapshot(q(), s => next(qsnap(s)), e => { try { wrap(e); } catch (x) { if (err) err(x); } }),
    doc: id => docRef(path + "/" + (id || autoId())),
    add: d => addDoc(collection(fs, path), clean(d)).then(r => docRef(r.path), wrap)
  };
}

window.QFB = {
  db: { doc: docRef, collection: colRef },
  onAuth: cb => onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email } : null)),
  signIn: (e, p) => signInWithEmailAndPassword(auth, e, p).then(c => c.user.uid),
  register: (e, p) => createUserWithEmailAndPassword(auth, e, p).then(c => c.user.uid),
  registerOther: async (e, p) => { const c = await createUserWithEmailAndPassword(secAuth, e, p); const uid = c.user.uid; await signOut(secAuth); return uid; },
  setPasswordOther: async (e, oldp, newp) => { const c = await signInWithEmailAndPassword(secAuth, e, oldp); await updatePassword(c.user, newp); await signOut(secAuth); },
  setPassword: p => updatePassword(auth.currentUser, p),
  resetEmail: e => sendPasswordResetEmail(auth, e),
  email: () => (auth.currentUser && auth.currentUser.email) || '',
  changeEmail: async (n, p) => { const u = auth.currentUser; await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, p)); await verifyBeforeUpdateEmail(u, n); },
  signOut: () => signOut(auth),
  dropCurrent: () => deleteUser(auth.currentUser)
};
window.dispatchEvent(new Event("qfb-ready"));

var chart7=function(id){
  var today=dayIdx(Date.now()),vals=[],labels=[];
  for(var i=6;i>=0;i--){vals.push(0);labels.push(new Date(Date.now()-i*864e5).toLocaleDateString('fr-FR',{weekday:'narrow'}))}
  S.ledger.forEach(function(l){if(l.kid===id&&l.delta>0&&l.type!=='echange'){var k=6-(today-dayIdx(l.at));if(k>=0&&k<=6)vals[k]+=l.delta}});
  var mx=Math.max.apply(null,[1].concat(vals));
  return '<div class="card"><span class="lbl">Points gagnés, 7 derniers jours</span><div class="chart">'+vals.map(function(v,k){return '<div class="col"><small>'+(v||'')+'</small><div class="cb" style="height:'+(v?Math.round(v/mx*72)+6:3)+'px'+(v?'':';opacity:.35')+'"></div><small>'+esc(labels[k])+'</small></div>'}).join('')+'</div></div>';
};
var boardCard=function(m){
  if(!fam().board||kids().length<2)return '';
  var ws=weekStats().sort(function(a,b){return b.pts-a.pts});
  return '<div class="card"><span class="lbl">Classement de la semaine</span><ol class="rank">'+ws.map(function(x,i){return '<li class="'+(x.kid.id===m.id?'me':'')+'">'+(i+1)+'. '+av(x.kid,'s')+' '+esc(x.kid.pseudo)+'<b>'+x.pts+' pts</b></li>'}).join('')+'</ol></div>';
};
var settingsX=function(f){

var phoneClean=function(v){var c=String(v||'').replace(/[\s.\-()]/g,'');return /^\+?\d{8,15}$/.test(c)?c:null};
var phoneShow=function(c){c=String(c||'');if(/^0\d{9}$/.test(c))return c.replace(/(\d{2})(?=\d)/g,'$1 ').trim();return c};
var numOf=function(id){var n=parseInt(val(id),10);return isFinite(n)?n:NaN};

/* ---------- Comptes (Firebase Authentication) ---------- */
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(h){return Array.prototype.map.call(new Uint8Array(h),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
var normLogin=function(p){return String(p||'').trim().toLowerCase().replace(/\s+/g,' ')};
var KIDMAIL='@kids.quetes-famille.invalid';
var kidEmail=function(code,login){return sha('qf:'+cleanCode(code)+':'+normLogin(login)).then(function(h){return h.slice(0,40)+KIDMAIL})};
var okMail=function(m){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)};
var okTutorCode=function(c){return /^[A-Za-z0-9]{8,12}$/.test(c)};
function fail(msg){setErr(msg);throw new Error('stop')}
function authFail(e){if(e&&e.message==='stop')return;setErr(errMsg(e))}

 createFam:function(){
   var name=val('f-name'),pseudo=val('f-pseudo'),mail=val('f-email').toLowerCase(),pass=document.getElementById('f-pass').value,pin=val('f-pin');
   if(!name||!pseudo)return setErr('Renseigne le nom de la famille et ton pseudo.');
   if(!okMail(mail))return setErr('Adresse e-mail invalide.');
   if(pass.length<6)return setErr('Le mot de passe doit contenir au moins 6 caractères.');
   if(!okTutorCode(pin))return setErr('Le code tuteur doit contenir 8 à 12 lettres ou chiffres.');
   var fid='f'+rid(),code=genCode(),uid=null;S.busy=true;
   function claim(n){
     return db.doc('codes/'+code).set({fid:fid,kids:[]}).catch(function(e){
       if(n>=4)throw e;code=genCode();
       return db.doc('families/'+fid).update({code:code}).then(function(){return claim(n+1)});
     });
   }
   return window.QFB.register(mail,pass).then(function(u){
     uid=u;S.uid=u;S.pid=u;
     return db.doc('families/'+fid).set({name:name,code:code,ownerUid:u,createdAt:Date.now()});
   }).then(function(){
     return db.doc('families/'+fid+'/people/'+uid).set({role:'tuteur',pseudo:pseudo,age:null,hue:0,createdAt:Date.now(),seenAt:Date.now()});
   }).then(function(){return db.doc('families/'+fid+'/private/pin').set({pin:pin})})
   .then(function(){return claim(0)})
   .then(function(){return db.doc('users/'+uid).set({fid:fid,role:'tuteur'})})
   .then(function(){S.busy=false;startFamily(fid,'tuteur');enter(uid,'tuteur')})
   .catch(function(e){S.busy=false;S.uid=null;S.pid=null;var p=uid?window.QFB.dropCurrent().catch(function(){}):Promise.resolve();return p.then(function(){authFail(e)})});
 },
 joinTutor:function(){
   var code=cleanCode(val('j-code')),pseudo=val('j-pseudo'),mail=val('j-email').toLowerCase(),pass=document.getElementById('j-pass').value,pin=val('j-pin');
   if(code.length<4||!pseudo||!pin)return setErr('Renseigne le code famille, ton pseudo et le code tuteur.');
   if(!okMail(mail))return setErr('Adresse e-mail invalide.');
   if(pass.length<6)return setErr('Le mot de passe doit contenir au moins 6 caractères.');
   var uid=null,fid=null;S.busy=true;
   return window.QFB.register(mail,pass).then(function(u){uid=u;S.uid=u;S.pid=u;return lookup(code)}).then(function(f){
     if(!f)fail('Code famille introuvable.');
     fid=f;
     return db.doc('families/'+fid+'/joinRequests/'+uid).set({pin:pin});
   }).then(function(){
     return db.doc('families/'+fid+'/people/'+uid).set({role:'tuteur',pseudo:pseudo,age:null,hue:1,createdAt:Date.now(),seenAt:Date.now()}).catch(function(e){
       if(e&&e.code==='permission-denied')fail('Code tuteur incorrect.');throw e});
   }).then(function(){return db.doc('families/'+fid+'/joinRequests/'+uid).delete().catch(function(){})})
   .then(function(){return db.doc('users/'+uid).set({fid:fid,role:'tuteur'})})
   .then(function(){S.busy=false;startFamily(fid,'tuteur');enter(uid,'tuteur')})
   .catch(function(e){S.busy=false;S.uid=null;S.pid=null;var p=uid?window.QFB.dropCurrent().catch(function(){}):Promise.resolve();return p.then(function(){authFail(e)})});
 },

 newKid:function(f){
   var pseudo=val('n-pseudo'),age=numOf('n-age'),pass=document.getElementById('n-pass').value;

   if(!(age>=3&&age<=17))return setErr("L'âge doit être compris entre 3 et 17 ans.");

     });

   return run(function(){
     return dref('wishes',w.id).update({status:'remis',deliveredAt:Date.now()}).then(function(){
       return notify(w.redeemedBy,'« '+w.title+' » t\'a été remis. Profites-en !','ok');
     });
   },'Marqué comme remis');
 },

 /* Famille */
 kidSheet:function(el){
   var k=P(el.dataset.id);if(!k)return;
   openSheet(k.pseudo,'<div class="hero sm"><span class="coin big">'+ic('star')+'</span><div><small>Points</small><div class="n">'+bal(k.id)+'</div></div></div>'+
   '<h3 class="sub">Ajouter ou retirer des points</h3><div class="field"><span class="lbl">Nombre de points</span>'+pills([5,10,20,50],'a-n',10)+'</div>'+
   '<div class="field"><label for="a-why">Raison (le mineur la voit)</label><input id="a-why" type="text" maxlength="60" placeholder="Chambre pas rangée" autocomplete="off"></div><p class="err" role="alert"></p>'+
   '<div class="acts" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn bad" type="button" data-a="adjust" data-id="'+esc(k.id)+'" data-v="-1">Retirer</button><button class="btn ok" type="button" data-a="adjust" data-id="'+esc(k.id)+'" data-v="1">Ajouter</button></div>'+
   '<h3 class="sub">Profil</h3><form data-submit="editKid" data-id="'+esc(k.id)+'"><div class="field"><label for="e-pseudo">Pseudo</label><input id="e-pseudo" type="text" maxlength="20" value="'+esc(k.pseudo)+'"></div><div class="field"><label for="e-age">Âge</label><input id="e-age" type="number" inputmode="numeric" min="3" max="17" value="'+esc(k.age||'')+'"></div><div class="field"><label for="e-phone">Téléphone (facultatif)</label><input id="e-phone" type="tel" inputmode="tel" maxlength="20" autocomplete="off" value="'+esc(phoneShow(k.phone||''))+'"></div><button class="btn ghost block" type="submit">Enregistrer</button></form>'+
   '<h3 class="sub">Connexion</h3><p class="muted">Identifiant : <b>'+esc(k.login||k.pseudo)+'</b> · code famille : <b>'+esc(fmtCode(fam().code||''))+'</b></p><p id="k-pw-cur" class="muted"></p><button class="btn ghost block" type="button" data-a="kidPwShow" data-id="'+esc(k.id)+'">Voir le mot de passe</button><form data-submit="kidPw" data-id="'+esc(k.id)+'" style="margin-top:10px"><div class="field"><label for="k-pw">Nouveau mot de passe</label><input id="k-pw" type="password" autocomplete="new-password"></div><button class="btn ghost block" type="submit">Changer le mot de passe</button></form>');
 },
 adjust:function(el){
   var k=P(el.dataset.id),n=numOf('a-n'),sign=parseInt(el.dataset.v,10),why=val('a-why');
   if(!k)return;
   if(!(n>=1&&n<=1000))return setErr('Saisis un nombre de points entre 1 et 1000.');
   if(sign<0&&bal(k.id)-n<0&&!negOk){negOk=1;return setErr('Cela rendrait le solde négatif. Appuie de nouveau sur Retirer pour confirmer.')}
   negOk=0;
   var d=sign*n;
   return run(function(){
     return col('ledger').add({kid:k.id,delta:d,reason:why||(d>0?'Bonus':'Retrait'),at:Date.now(),type:'ajust',by:actorId()}).then(function(){
       return notify(k.id,(d>0?'+':'')+d+' pts'+(why?' : '+why:'')+'.',d>0?'ok':'bad');
     });
   },(d>0?'+':'')+d+' pts pour '+k.pseudo).then(function(ok){if(ok){if(!S.parentOk)closeSheet();else{var w=document.getElementById('a-why');if(w)w.value=''}}});
 },
 editKid:function(f){
   var k=P(f.dataset.id),pseudo=val('e-pseudo'),age=numOf('e-age'),pv=val('e-phone'),pc=pv?phoneClean(pv):'';
   if(!k)return;
   if(!pseudo)return setErr('Le pseudo ne peut pas être vide.');
   if(!(age>=3&&age<=17))return setErr("L'âge doit être compris entre 3 et 17 ans.");
   if(pv&&!pc)return setErr('Numéro invalide. Saisis 8 à 15 chiffres.');
   return run(function(){return dref('people',k.id).update({pseudo:pseudo,age:age,phone:pc})},'Profil enregistré').then(function(ok){if(ok)closeSheet()});
 },

 /* Notifications */
 notifs:function(){
   var list=myNotifs(),m=me(),seen=(m&&m.seenAt)||0;
   openSheet('Notifications',list.length?'<ul class="lst">'+list.slice(0,40).map(function(n){return '<li class="'+(n.at>seen?'new':'')+'"><div class="grow"><span>'+esc(n.text)+'</span><small>'+ago(n.at)+'</small></div></li>'}).join('')+'</ul>':'<p class="muted">Rien pour l\'instant. Les messages apparaissent ici quand quelque chose change dans la famille.</p><p class="muted" style="margin-top:10px">Ces notifications s\'affichent dans l\'app. Il n\'y a pas d\'alerte sur le téléphone quand l\'app est fermée.</p>');
   if(unread()>0&&!S.readonly)dref('people',S.pid).update({seenAt:Date.now()}).catch(function(){});
 }
};
function arm(el){
  if(el.dataset.armed)return false;
  el.dataset.armed='1';var old=el.innerHTML;el.innerHTML='Confirmer ?';el.classList.add('bad');
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.innerHTML=old;el.classList.remove('bad')}},3000);
  return true;
}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var sh=$('#sheet');
  if(e.target===sh){closeSheet();return}
  var el=e.target.closest('[data-a]');if(!el)return;
  var fn=A[el.dataset.a];if(!fn)return;
  if(el.dataset.busy)return;
  e.preventDefault();
  var r=fn(el);
  if(r&&typeof r.then==='function'){el.dataset.busy='1';el.classList.add('busy');var done=function(){delete el.dataset.busy;el.classList.remove('busy');if(S.parentOk&&el.closest('#sheet')&&['pAdjust','validate','deliver'].indexOf(el.dataset.a)>-1)refreshParent()};r.then(done,done)}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-submit]');if(!f)return;
  e.preventDefault();
  if(f.dataset.busy)return;
  var fn=A[f.dataset.submit];if(!fn)return;
  var r=fn(f);
  if(r&&typeof r.then==='function'){f.dataset.busy='1';var b=f.querySelector('[type=submit]');if(b)b.disabled=true;var done=function(){delete f.dataset.busy;if(b)b.disabled=false};r.then(done,done)}
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||t.type!=='number')return;
  var p=t.parentElement&&t.parentElement.querySelector('.pills');if(!p)return;
  Array.prototype.forEach.call(p.querySelectorAll('.pill'),function(b){b.classList.toggle('on',b.dataset.v===t.value)});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='bg-color'){bgSet({t:'color',v:t.value})}
  else if(t.id==='bg-veil'){bgVeil(parseInt(t.value,10),true)}
  else if(t.id==='bg-file'&&t.files&&t.files[0]){bgFile(t.files[0]);t.value=''}
  else if(t.id==='av-file'&&t.files&&t.files[0]){avFile(t.files[0]);t.value=''}
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||t.id!=='bg-veil')return;
  var l=document.getElementById('bg-veil-v');if(l)l.textContent=t.value;
  bgVeil(parseInt(t.value,10),false);
});

/* ---------- Démarrage ---------- */
var lastTick=Date.now();
var lastMin=0;
setInterval(function(){var now=Date.now(),hit=S.quests.some(function(q){return q.status==='open'&&q.deadline>lastTick&&q.deadline<=now});lastTick=now;var soon=S.step==='app'&&S.tab==='quetes'&&now-lastMin>=60000&&S.quests.some(function(q){return q.status==='open'&&q.deadline>now&&q.deadline-now<864e5});if(soon)lastMin=now;if((hit||soon)&&S.step==='app')schedule()},15000);
render();
(function boot(){
  var started=false;
  function afterAuth(uid){
    return db.doc('users/'+uid).get().then(function(sn){
      if(!sn.exists){S.step='welcome';try{window.QFB.signOut()}catch(e){}render();return}
      var d=sn.data();S.uid=uid;S.pid=uid;startFamily(d.fid,d.role);S.step='resolve';render();
    },function(){S.step='blocked';render()});
  }
  function go(){
    if(started)return;started=true;
    db=window.QFB.db;
    window.QFB.onAuth(function(u){
      if(S.busy)return;
      if(!u){if(S.step!=='login'&&S.step!=='tutor'&&S.step!=='kid'){forget();S.uid=null;S.step='welcome';render()}return}
      if(S.uid===u.uid&&S.fid)return;
      afterAuth(u.uid);
    });
  }
  if(window.QFB)go();else window.addEventListener('qfb-ready',go,{once:true});
  setTimeout(function(){if(!started){S.step='blocked';render()}},15000);
})();
})();
</script>
